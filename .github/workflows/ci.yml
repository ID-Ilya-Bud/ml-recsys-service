  name: pipecicd
  on: push
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - name: Install flake8
          run: pip install flake8
        - name: Start flake8
          run: flake8 .
        - name: Docker build
          run : docker build  -t ${{ secrets.DOCKERHUB_NAME }}/ml-recsys .
        - name: Docker login
          run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_NAME }} --password-stdin
        - name: Docker push
          run: docker push ${{ secrets.DOCKERHUB_NAME }}/ml-recsys